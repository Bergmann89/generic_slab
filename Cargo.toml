[package]
name = "generic_slab"
version = "0.1.1"
authors = [ "Bergmann89 <info@bergmann89.de>", "Carl Lerche <me@carllerche.com>" ]
edition = "2018"
rust-version = "1.31"
license = "MIT"
description = "Pre-allocated storage for a uniform data type"
repository = "https://github.com/Bergmann89/generic_slab"
keywords = [ "slab", "allocator", "no_std", "fixed", "generic" ]
categories = [ "memory-management", "data-structures", "no-std" ]
exclude = [ "/.*" ]

[package.metadata.docs.rs]
all-features = true

[features]
std = [ ]
default = [ "std" ]
range = [ ]

[build-dependencies]
autocfg = "1"

[dependencies]
serde = { version = "1.0", optional = true, default-features = false, features = [ "alloc" ] }

[dev-dependencies]
arrayvec = "0.7.4"
rustversion = "1"
serde = { version = "1", features = [ "derive" ] }
serde_test = "1"


[lints.rust]
future_incompatible = { level = "warn", priority = -1}
incomplete_features = "allow"
missing_debug_implementations = { level = "warn", priority = -1}
missing_docs  = { level = "warn", priority = -1}
nonstandard_style = { level = "warn", priority = -1}
rust_2018_idioms = { level = "warn", priority = -1}
rust_2021_compatibility = { level = "warn", priority = -1}
unexpected_cfgs = "allow"
unreachable_pub  = { level = "warn", priority = -1}
unused = { level = "warn", priority = -1}

[lints.clippy]
cast_possible_truncation = "warn"
default_trait_access = "allow"
explicit_iter_loop = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
missing_fields_in_debug = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
no_effect_underscore_binding = "allow"
pedantic = { level = "warn", priority = -1}
similar_names = "allow"
single_match_else = "allow"
struct_field_names = "allow"
uninlined_format_args = "allow"
